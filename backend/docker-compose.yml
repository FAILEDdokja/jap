# Local PostgreSQL for the JAP backend (Phase 2 — database).
#
# Usage:
#   docker compose up -d        # start Postgres on :5432
#   docker compose down         # stop (data persists in the named volume)
#   docker compose down -v      # stop AND wipe data
#
# The app reads the connection string from DATABASE_URL (see .env.example).
services:
  db:
    image: postgres:16-alpine
    container_name: jap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jap
    ports:
      - "5432:5432"
    volumes:
      - jap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jap_pgdata:
